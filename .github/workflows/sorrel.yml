name: Sorrel OTA Checker

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:          # allow manual runs from the Actions tab

jobs:
  check-sorrel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sorrel checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_2: ${{ secrets.DISCORD_WEBHOOK_2 }}
        run: |
          python sorrel_checker.py --sorrel

      - name: Commit archived URLs if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add archived.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update archived URLs"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Upload log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorrel-log-${{ github.run_id }}
          path: sorrel_checker.log
          retention-days: 30
